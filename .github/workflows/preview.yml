name: Site preview

# Builds the package + site and deploys to the Cloudflare Pages project
# "komo" under a per-branch alias, so every push updates the same URL:
#   https://<branch>.komo-wb5.pages.dev
# Requires the CLOUDFLARE_API_TOKEN repository secret (Pages: Edit).

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: true

concurrency:
  group: preview-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 944ca70087298faa2e84783db46162c5
        run: |
          pnpm exec wrangler pages deploy packages/komo-site/dist \
            --project-name komo --branch "$BRANCH" --commit-dirty=true
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-28 | sed -E 's/-+$//')
          echo "url=https://$alias.komo-wb5.pages.dev" >> "$GITHUB_OUTPUT"
      - run: echo "Preview → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
