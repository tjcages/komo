name: Site preview

# Builds the package + site and uploads a new komo-site Worker version under a
# per-branch preview alias. Production (komo.offbr.co) is not touched; every
# push updates the same URL:
#   https://<branch>-komo-site.<account>.workers.dev
# Requires the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts: Edit).

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: true

concurrency:
  group: preview-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40 | sed -E 's/-+$//')
          pnpm exec wrangler versions upload --config packages/komo-site/wrangler.jsonc \
            --preview-alias "$alias" --message "$BRANCH @ ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -oE 'https://[a-z0-9.-]*workers\.dev' upload.log | grep "^https://$alias-" | head -1)
          echo "Preview → ${url:-see log above}" >> "$GITHUB_STEP_SUMMARY"
